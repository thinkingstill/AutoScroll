<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AutoScroll Gestures</title>
    <style>
      body { 
        font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif; 
        margin: 12px;
        min-width: 280px;
      }
      .row { 
        display: flex; 
        gap: 8px; 
        align-items: center; 
        margin-bottom: 8px;
      }
      button { 
        padding: 8px 12px; 
        border: 1px solid #ccc; 
        border-radius: 6px; 
        cursor: pointer;
        background: white;
        font-size: 13px;
      }
      button:hover {
        background: #f0f0f0;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: #4CAF50;
        color: white;
        border: none;
      }
      button.primary:hover {
        background: #45a049;
      }
      #status { 
        font-size: 12px; 
        color: #555;
        padding: 4px 0;
        margin-bottom: 8px;
      }
      .warning {
        background: #fff3cd;
        border: 1px solid #ffc107;
        padding: 10px;
        border-radius: 6px;
        font-size: 12px;
        margin: 10px 0;
      }
      .info {
        font-size: 11px;
        color: #888;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #eee;
      }
      .divider {
        height: 1px;
        background: #eee;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div id="permissionWarning" class="warning" style="display:none;">
      ⚠️ 需要摄像头权限
      <button id="setupPermission" class="primary" style="margin-top:8px; width:100%;">
        设置权限
      </button>
    </div>
    
    <div class="row">
      <button id="toggle">启动识别</button>
      <button id="pause" disabled>暂停</button>
    </div>
    <div id="status">未运行</div>
    
    <div class="divider"></div>
    
    <div class="info">
      💡 支持网站: 抖音、快手、Instagram<br>
      ✋ 手势: 张开手掌左右/上下移动<br>
      ✊ 握拳暂停/恢复
    </div>
    
    <script src="popup.js"></script>
  </body>
</html>
